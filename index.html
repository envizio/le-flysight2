<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Leading Edge Live</title>
<style>
  /* Leading Edge tokens (colors_and_type.css); fonts are self-hosted so the app works offline */
  @font-face { font-family: "Anton"; src: url("fonts/anton.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/mono.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    --ink-1000: #04060D; --ink-900: #07091A; --ink-300: #7E8AAE; --ink-200: #B8BFD4;
    --signal-500: #FF6B1A; --success: #4ECB81; --warning: #E9B341;
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.22);
    --font-display: "Anton", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink-1000); color: #fff; font-family: var(--font-body);
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  .mono { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-300); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  header img { height: 26px; width: auto; display: block; }
  #age { color: var(--signal-500); white-space: nowrap; }
  #statusbar { display: flex; align-items: center; padding: 12px 0; letter-spacing: .14em; }
  #dot { flex: none; width: 8px; height: 8px; background: var(--ink-300); margin-right: 10px; }
  #dot.live { background: var(--success); }
  #dot.stale { background: var(--warning); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  #alt { font-family: var(--font-display); font-size: min(34vw, 36vh); line-height: .96; letter-spacing: -.015em; margin-top: 10px; }
  #unit { font-family: var(--font-display); font-size: 32px; line-height: 1; color: var(--signal-500); text-transform: uppercase; }
  #secondary { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-top: 28px; border: 1px solid var(--border); }
  #secondary > div { padding: 12px 8px; }
  #secondary > div + div { border-left: 1px solid var(--border); }
  #secondary b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.1; }
  footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button {
    font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
    color: #fff; background: var(--ink-900); border: 1px solid var(--border-strong); border-radius: 0; padding: 16px 4px;
  }
  button:active { border-color: var(--signal-500); color: var(--signal-500); }
  button.primary {
    grid-column: 1 / -1; padding: 18px; background: var(--signal-500); border-color: var(--signal-500); color: var(--ink-1000);
    font-family: var(--font-display); font-size: 24px; letter-spacing: .04em;
  }
  button.primary:active { background: #FF8A4D; color: var(--ink-1000); }
  #msg { min-height: 18px; margin: 10px 0 6px; font-size: 13px; line-height: 1.4; color: var(--warning); text-align: center; }
  #raw { font-size: 9px; letter-spacing: .04em; color: #4A5781; text-align: center; word-break: break-all; min-height: 12px; margin-bottom: 8px; text-transform: none; }
  button:disabled { opacity: .35; }
  button.primary.off { background: transparent; color: #fff; border-color: var(--border-strong); }
  #dzBtn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog { width: min(92vw, 420px); background: var(--ink-900); color: #fff; border: 1px solid var(--border-strong); border-radius: 0; padding: 20px; }
  dialog::backdrop { background: rgba(4, 6, 13, .8); }
  dialog h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1; text-transform: uppercase; margin: 8px 0 18px; }
  dialog label { display: block; margin: 14px 0 6px; }
  dialog input, dialog select {
    width: 100%; font-family: var(--font-body); font-size: 18px; color: #fff; background: var(--ink-1000);
    border: 1px solid var(--border-strong); border-radius: 0; padding: 12px; -webkit-user-select: text; user-select: text;
  }
  dialog .row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
  dialog .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  dialog .wide { grid-column: 1 / -1; }
  dialog button.save { background: var(--signal-500); border-color: var(--signal-500); color: var(--ink-1000); }
</style>
</head>
<body>
<header>
  <img src="logo-light.webp" alt="Leading Edge">
  <span id="age" class="mono"></span>
</header>
<div id="statusbar" class="mono"><span id="dot"></span><span id="status">Not connected</span></div>

<main>
  <div id="label" class="mono">[ GPS altitude // MSL ]</div>
  <div id="alt">---</div>
  <div id="unit">ft</div>
  <div id="secondary">
    <div><b id="vs">--</b><span class="mono">Vertical mph</span></div>
    <div><b id="gs">--</b><span class="mono">Ground mph</span></div>
  </div>
</main>

<div id="msg"></div>
<div id="raw" class="mono">LE LIVE v5</div>
<footer>
  <button id="connect" class="primary">Connect FlySight →</button>
  <button id="units">ft / m</button>
  <button id="dzBtn">Dropzone</button>
  <button id="mode" disabled>MSL</button>
</footer>

<dialog id="dzDialog">
  <div class="mono">[ Dropzone // elevation ]</div>
  <h2>Dropzone</h2>
  <label class="mono" for="dzSel">Saved dropzones</label>
  <select id="dzSel"></select>
  <label class="mono" for="dzName">Name</label>
  <input id="dzName" maxlength="30" autocomplete="off" placeholder="e.g. Home DZ">
  <label class="mono" for="dzElev">Elevation above sea level</label>
  <div class="row">
    <input id="dzElev" type="number" inputmode="decimal" step="any" placeholder="0">
    <select id="dzUnit"><option value="ft">ft</option><option value="m">m</option></select>
  </div>
  <div class="actions">
    <button id="dzGps" class="wide">Use current GPS altitude</button>
    <button id="dzSave" class="save">Save + use</button>
    <button id="dzDelete">Delete</button>
    <button id="dzClose" class="wide">Close</button>
  </div>
</dialog>

<script>
// UUIDs and packet layout from flysight/flysight-2-firmware (STM32_WPAN/App/custom_stm.c, custom_app.c)
const GNSS_SERVICE = '00000001-cc7a-482a-984a-7f2ed5b3e58f';
const GNSS_PV_CHAR = '00000000-8e22-4541-9d4c-21edae82ed19';
const FT_PER_M = 3.28084;
const STORE_KEY = 'le-live';

const $ = id => document.getElementById(id);
let device = null, lastMm = null, lastRx = 0, wakeLock = null, wantConnected = false, connecting = false;

// Remembered between visits: display units, saved dropzones, and the last FlySight
// state.dzs = [{ name, elev, unit }] with elev in the unit it was entered in
let state = { feet: true, agl: true, dzs: [], activeDz: -1, device: null, auto: false };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} }

function setStatus(text, cls) { $('status').textContent = text; $('dot').className = cls || ''; }
function setMsg(text) { $('msg').textContent = text || ''; }
function setConnectButton() {
  $('connect').textContent = wantConnected ? 'Disconnect' : 'Connect FlySight →';
  $('connect').classList.toggle('off', wantConnected);
}

const activeDz = () => state.dzs[state.activeDz] || null;
const dzElevM = dz => dz.unit === 'ft' ? dz.elev / FT_PER_M : dz.elev;

function render() {
  const dz = activeDz(), agl = dz && state.agl;
  $('unit').textContent = state.feet ? 'ft' : 'm';
  $('label').textContent = agl ? `[ Height // above ${dz.name} ]` : '[ GPS altitude // MSL ]';
  $('dzBtn').textContent = dz ? dz.name : 'Dropzone';
  $('mode').textContent = agl ? 'AGL' : 'MSL';
  $('mode').disabled = !dz;
  if (lastMm === null) return;
  const m = lastMm / 1000 - (agl ? dzElevM(dz) : 0);
  $('alt').textContent = Math.round(state.feet ? m * FT_PER_M : m).toLocaleString();
}

function onPacket(e) {
  const dv = e.target.value;
  $('raw').textContent = [...new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)]
    .map(b => b.toString(16).padStart(2, '0')).join(' ');

  // Byte 0 is a field mask (0xb0 = time of week + position + velocity); everything is little-endian.
  const mask = dv.getUint8(0);
  let o = 1;
  if (mask & 0x80) o += 4;                       // iTOW (ms)
  if (!(mask & 0x20) || dv.byteLength < o + 12) { setMsg('Packet has no position data'); return; }
  lastMm = dv.getInt32(o + 8, true);             // lon, lat, then hMSL (mm)
  o += 12;
  if ((mask & 0x10) && dv.byteLength >= o + 12) {
    const velN = dv.getInt32(o, true), velE = dv.getInt32(o + 4, true), velD = dv.getInt32(o + 8, true); // mm/s
    const MPH = 0.00223694;
    $('vs').textContent = Math.round(velD * MPH);  // positive = descending
    $('gs').textContent = Math.round(Math.hypot(velN, velE) * MPH);
  }
  lastRx = Date.now();
  setMsg('');
  render();
}

/* ── Bluetooth ─────────────────────────────────────────────────────────── */

function adopt(d) {
  device = d;
  device.addEventListener('gattserverdisconnected', () => {
    if (!wantConnected) return;
    setStatus('Reconnecting…', 'stale');
    reconnect();
  });
}

async function subscribe() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(GNSS_SERVICE);
  const ch = await service.getCharacteristic(GNSS_PV_CHAR);
  ch.addEventListener('characteristicvaluechanged', onPacket);
  await ch.startNotifications();
  setStatus('Connected — waiting for GPS', 'stale');
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}

// Keep trying until the FlySight is back in range or the user disconnects
async function reconnect() {
  if (connecting) return;
  connecting = true;
  while (wantConnected) {
    try { await subscribe(); break; }
    catch { await new Promise(r => setTimeout(r, 1500)); }
  }
  connecting = false;
}

// After a reload, pick the remembered FlySight back up without showing the device picker.
// Chrome only hands back remembered devices when its persistent Bluetooth permissions are on.
async function resume() {
  if (!state.auto || !state.device || !navigator.bluetooth) return;
  let known = [];
  try { known = await navigator.bluetooth.getDevices(); } catch {}
  const d = known.find(x => x.id === state.device.id);
  if (!d) { setStatus(`Tap connect to rejoin ${state.device.name}`); return; }
  adopt(d);
  wantConnected = true;
  setConnectButton();
  setStatus(`Reconnecting to ${state.device.name}…`, 'stale');
  reconnect();
}

$('connect').onclick = async () => {
  if (wantConnected) {
    wantConnected = false;
    state.auto = false; save();
    device?.gatt.disconnect();
    setConnectButton();
    setStatus('Not connected');
    return;
  }
  if (!navigator.bluetooth) {
    setMsg('This browser has no Web Bluetooth. Use Chrome on Android, or the Bluefy browser on iPhone.');
    return;
  }
  try {
    setMsg('');
    // Only list FlySights: by advertised name, or by FlySight's manufacturer ID in case the unit has been renamed
    adopt(await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'FlySight' }, { manufacturerData: [{ companyIdentifier: 0x09DB }] }],
      optionalServices: [GNSS_SERVICE],
    }));
    setStatus('Connecting…');
    await subscribe();
    wantConnected = true;
    state.device = { id: device.id, name: device.name || 'FlySight' };
    state.auto = true; save();
    setConnectButton();
  } catch (err) {
    wantConnected = false;
    setStatus('Not connected');
    if (err.name !== 'NotFoundError') setMsg(err.message + ' — if this is the first connection, put the FlySight in pairing mode and accept the pairing prompt.');
  }
};

/* ── Units and dropzones ───────────────────────────────────────────────── */

$('units').onclick = () => { state.feet = !state.feet; save(); render(); };
$('mode').onclick = () => { state.agl = !state.agl; save(); render(); };

const NONE = '-1', NEW = 'new';
function fillDzForm() {
  const sel = $('dzSel');
  sel.replaceChildren(
    new Option('None — show MSL', NONE),
    ...state.dzs.map((dz, i) => new Option(`${dz.name} — ${dz.elev} ${dz.unit}`, i)),
    new Option('+ New dropzone', NEW));
  sel.value = activeDz() ? state.activeDz : (state.dzs.length ? NONE : NEW);
  loadDzFields();
}
function loadDzFields() {
  const dz = state.dzs[$('dzSel').value];
  $('dzName').value = dz ? dz.name : '';
  $('dzElev').value = dz ? dz.elev : '';
  $('dzUnit').value = dz ? dz.unit : (state.feet ? 'ft' : 'm');
  $('dzDelete').disabled = !dz;
}

$('dzBtn').onclick = () => { fillDzForm(); $('dzDialog').showModal(); };
$('dzClose').onclick = () => $('dzDialog').close();
$('dzSel').onchange = () => {
  const v = $('dzSel').value;
  if (v !== NEW) { state.activeDz = Number(v); state.agl = true; save(); render(); }
  loadDzFields();
};
$('dzGps').onclick = () => {
  if (lastMm === null) { $('dzElev').placeholder = 'No GPS reading yet'; return; }
  const m = lastMm / 1000;
  $('dzElev').value = Math.round($('dzUnit').value === 'ft' ? m * FT_PER_M : m);
};
$('dzSave').onclick = () => {
  const name = $('dzName').value.trim(), elev = parseFloat($('dzElev').value);
  if (!name) { $('dzName').focus(); return; }
  if (!Number.isFinite(elev)) { $('dzElev').focus(); return; }
  const dz = { name, elev, unit: $('dzUnit').value };
  const i = Number($('dzSel').value);
  if (state.dzs[i]) { state.dzs[i] = dz; state.activeDz = i; }
  else { state.dzs.push(dz); state.activeDz = state.dzs.length - 1; }
  state.agl = true;
  save(); render();
  $('dzDialog').close();
};
$('dzDelete').onclick = () => {
  const i = Number($('dzSel').value);
  if (!state.dzs[i]) return;
  state.dzs.splice(i, 1);
  state.activeDz = -1;
  save(); render(); fillDzForm();
};

setInterval(() => {
  if (!lastRx) return;
  const age = (Date.now() - lastRx) / 1000;
  $('age').textContent = age < 2 ? 'live' : `${Math.round(age)}s ago`;
  if (wantConnected && device?.gatt.connected) setStatus(age < 2 ? 'Live' : 'No data — is the FlySight on with a fix?', age < 2 ? 'live' : 'stale');
}, 500);

// Cache the app so it opens with no data connection
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => { if (!lastRx) $('age').textContent = '[ offline ready ]'; })
    .catch(() => {});
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wantConnected) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
});

render();
resume();
</script>
</body>
</html>
