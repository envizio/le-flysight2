<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Leading Edge Live</title>
<style>
  /* Leading Edge tokens (colors_and_type.css); fonts are self-hosted so the app works offline */
  @font-face { font-family: "Anton"; src: url("fonts/anton.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Archivo"; src: url("fonts/archivo.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/mono.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    --ink-1000: #04060D; --ink-900: #07091A; --ink-300: #7E8AAE; --ink-200: #B8BFD4;
    --signal-500: #FF6B1A; --success: #4ECB81; --warning: #E9B341;
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.22);
    --font-display: "Anton", "Arial Narrow", sans-serif;
    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink-1000); color: #fff; font-family: var(--font-body);
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  .mono { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-300); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  header img { height: 26px; width: auto; display: block; }
  #age { color: var(--signal-500); white-space: nowrap; }
  #statusbar { display: flex; align-items: center; padding: 12px 0; letter-spacing: .14em; }
  #dot { flex: none; width: 8px; height: 8px; background: var(--ink-300); margin-right: 10px; }
  #dot.live { background: var(--success); }
  #dot.stale { background: var(--warning); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  #alt { font-family: var(--font-display); font-size: min(34vw, 36vh); line-height: .96; letter-spacing: -.015em; margin-top: 10px; }
  #unit { font-family: var(--font-display); font-size: 32px; line-height: 1; color: var(--signal-500); text-transform: uppercase; }
  #secondary { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin-top: 28px; border: 1px solid var(--border); }
  #secondary > div { padding: 12px 8px; }
  #secondary > div + div { border-left: 1px solid var(--border); }
  #secondary b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.1; }
  footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button {
    font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
    color: #fff; background: var(--ink-900); border: 1px solid var(--border-strong); border-radius: 0; padding: 16px 4px;
  }
  button:active { border-color: var(--signal-500); color: var(--signal-500); }
  button.primary {
    grid-column: 1 / -1; padding: 18px; background: var(--signal-500); border-color: var(--signal-500); color: var(--ink-1000);
    font-family: var(--font-display); font-size: 24px; letter-spacing: .04em;
  }
  button.primary:active { background: #FF8A4D; color: var(--ink-1000); }
  #msg { min-height: 18px; margin: 10px 0 6px; font-size: 13px; line-height: 1.4; color: var(--warning); text-align: center; }
  #raw { font-size: 9px; letter-spacing: .04em; color: #4A5781; text-align: center; word-break: break-all; min-height: 12px; margin-bottom: 8px; text-transform: none; }
</style>
</head>
<body>
<header>
  <img src="logo-light.webp" alt="Leading Edge">
  <span id="age" class="mono"></span>
</header>
<div id="statusbar" class="mono"><span id="dot"></span><span id="status">Not connected</span></div>

<main>
  <div id="label" class="mono">[ GPS altitude // MSL ]</div>
  <div id="alt">---</div>
  <div id="unit">ft</div>
  <div id="secondary">
    <div><b id="vs">--</b><span class="mono">Vertical mph</span></div>
    <div><b id="gs">--</b><span class="mono">Ground mph</span></div>
  </div>
</main>

<div id="msg"></div>
<div id="raw" class="mono">LE LIVE v3</div>
<footer>
  <button id="connect" class="primary">Connect FlySight →</button>
  <button id="units">ft / m</button>
  <button id="zero">Zero here</button>
  <button id="clear">MSL</button>
</footer>

<script>
// UUIDs and packet layout from flysight/flysight-2-firmware (STM32_WPAN/App/custom_stm.c, custom_app.c)
const GNSS_SERVICE = '00000001-cc7a-482a-984a-7f2ed5b3e58f';
const GNSS_PV_CHAR = '00000000-8e22-4541-9d4c-21edae82ed19';

const $ = id => document.getElementById(id);
let device = null, feet = true, zeroMm = null, lastMm = null, lastRx = 0, wakeLock = null, wantConnected = false;

function setStatus(text, cls) { $('status').textContent = text; $('dot').className = cls || ''; }
function setMsg(text) { $('msg').textContent = text || ''; }

function render() {
  $('unit').textContent = feet ? 'ft' : 'm';
  $('label').textContent = zeroMm === null ? '[ GPS altitude // MSL ]' : '[ Height // above zero ]';
  if (lastMm === null) return;
  const m = (lastMm - (zeroMm ?? 0)) / 1000;
  $('alt').textContent = Math.round(feet ? m * 3.28084 : m).toLocaleString();
}

function onPacket(e) {
  const dv = e.target.value;
  $('raw').textContent = [...new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength)]
    .map(b => b.toString(16).padStart(2, '0')).join(' ');

  // Byte 0 is a field mask (0xb0 = time of week + position + velocity); everything is little-endian.
  const mask = dv.getUint8(0);
  let o = 1;
  if (mask & 0x80) o += 4;                       // iTOW (ms)
  if (!(mask & 0x20) || dv.byteLength < o + 12) { setMsg('Packet has no position data'); return; }
  lastMm = dv.getInt32(o + 8, true);             // lon, lat, then hMSL (mm)
  o += 12;
  if ((mask & 0x10) && dv.byteLength >= o + 12) {
    const velN = dv.getInt32(o, true), velE = dv.getInt32(o + 4, true), velD = dv.getInt32(o + 8, true); // mm/s
    const MPH = 0.00223694;
    $('vs').textContent = Math.round(velD * MPH);  // positive = descending
    $('gs').textContent = Math.round(Math.hypot(velN, velE) * MPH);
  }
  lastRx = Date.now();
  setMsg('');
  render();
}

async function subscribe() {
  setStatus('Connecting…');
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(GNSS_SERVICE);
  const ch = await service.getCharacteristic(GNSS_PV_CHAR);
  ch.addEventListener('characteristicvaluechanged', onPacket);
  await ch.startNotifications();
  setStatus('Connected — waiting for GPS', 'stale');
  $('connect').textContent = 'Disconnect';
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}

async function reconnect() {
  for (let i = 0; wantConnected && i < 20; i++) {
    try { await subscribe(); return; }
    catch { await new Promise(r => setTimeout(r, 1500)); }
  }
  if (wantConnected) { setStatus('Disconnected'); $('connect').textContent = 'Connect FlySight →'; wantConnected = false; }
}

$('connect').onclick = async () => {
  if (wantConnected) {
    wantConnected = false;
    device?.gatt.disconnect();
    $('connect').textContent = 'Connect FlySight →';
    setStatus('Not connected');
    return;
  }
  if (!navigator.bluetooth) {
    setMsg('This browser has no Web Bluetooth. Use Chrome on Android, or the Bluefy browser on iPhone.');
    return;
  }
  try {
    setMsg('');
    // List every nearby BLE device: the FlySight's advertised name is user-configurable, so don't filter on it
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [GNSS_SERVICE] });
    device.addEventListener('gattserverdisconnected', () => {
      if (!wantConnected) return;
      setStatus('Reconnecting…', 'stale');
      reconnect();
    });
    wantConnected = true;
    await subscribe();
  } catch (err) {
    wantConnected = false;
    setStatus('Not connected');
    if (err.name !== 'NotFoundError') setMsg(err.message + ' — if this is the first connection, put the FlySight in pairing mode and accept the pairing prompt.');
  }
};

$('units').onclick = () => { feet = !feet; render(); };
$('zero').onclick = () => { if (lastMm !== null) { zeroMm = lastMm; render(); } };
$('clear').onclick = () => { zeroMm = null; render(); };

setInterval(() => {
  if (!lastRx) return;
  const age = (Date.now() - lastRx) / 1000;
  $('age').textContent = age < 2 ? 'live' : `${Math.round(age)}s ago`;
  if (wantConnected && device?.gatt.connected) setStatus(age < 2 ? 'Live' : 'No data — is the FlySight on with a fix?', age < 2 ? 'live' : 'stale');
}, 500);

// Cache the app so it opens with no data connection
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => { if (!lastRx) $('age').textContent = '[ offline ready ]'; })
    .catch(() => {});
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wantConnected) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  }
});
</script>
</body>
</html>
